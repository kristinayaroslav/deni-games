 <ellipse cx="91" cy="139" rx="10" ry="13" fill="#392b23"/><ellipse cx="169" cy="139" rx="10" ry="13" fill="#392b23"/>
 <circle cx="94" cy="135" r="3" fill="white"/><circle cx="172" cy="135" r="3" fill="white"/>
 <ellipse cx="130" cy="168" rx="14" ry="11" fill="#392b23"/>
 <path d="M111 190q19 22 38 0" fill="none" stroke="#76513b" stroke-width="7" stroke-linecap="round"/>
 <ellipse cx="72" cy="179" rx="16" ry="9" fill="#df987f" opacity=".45"/><ellipse cx="188" cy="179" rx="16" ry="9" fill="#df987f" opacity=".45"/>
 <g class="paw"><path class="outline" fill="url(#bear)" d="M52 265q-42-47-24-77 21-28 49 8l47 65-34 34z"/></g>
 <g class="paw r"><path class="outline" fill="url(#bear)" d="M208 265q42-47 24-77-21-28-49 8l-47 65 34 34z"/></g>
</g>
<!-- bunny -->
<g transform="translate(352 70)">
 <ellipse cx="100" cy="375" rx="103" ry="19" fill="#b9a88e" opacity=".35"/>
 <g class="ear"><ellipse class="outline" cx="57" cy="76" rx="34" ry="102" fill="url(#bunny)" transform="rotate(-12 57 76)"/><ellipse cx="57" cy="75" rx="16" ry="77" fill="#e9aaa2" transform="rotate(-12 57 75)"/></g>
 <g class="ear"><ellipse class="outline" cx="145" cy="76" rx="34" ry="102" fill="url(#bunny)" transform="rotate(12 145 76)"/><ellipse cx="145" cy="75" rx="16" ry="77" fill="#e9aaa2" transform="rotate(12 145 75)"/></g>
 <ellipse class="outline" cx="100" cy="277" rx="90" ry="105" fill="url(#bunny)"/>
 <circle class="outline" cx="100" cy="174" r="100" fill="url(#bunny)"/>
 <ellipse cx="100" cy="206" rx="62" ry="47" fill="#fff8ed"/>
 <ellipse cx="65" cy="166" rx="9" ry="12" fill="#392b23"/><ellipse cx="135" cy="166" rx="9" ry="12" fill="#392b23"/>
 <circle cx="68" cy="162" r="3" fill="white"/><circle cx="138" cy="162" r="3" fill="white"/>
