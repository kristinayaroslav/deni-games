<g transform="translate(640 110)">
 <ellipse cx="100" cy="334" rx="111" ry="19" fill="#b9a88e" opacity=".35"/>
 <path class="outline" d="M34 268q-58 25-23 83 52 25 105-30" fill="url(#fox)"/>
 <path d="M26 327q37 8 69-16" fill="none" stroke="#fff0dc" stroke-width="25" stroke-linecap="round"/>
