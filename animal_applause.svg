 <path class="outline" d="M9 145L20 25 91 79 109 79 180 25 191 145q-4 102-91 110Q13 247 9 145z" fill="url(#fox)"/>
 <path d="M35 113L30 53 76 93zM124 93l46-40-5 60z" fill="#f4c3a3"/>
 <path d="M18 165q82-69 164 0-19 80-82 83-63-3-82-83z" fill="#fff1df"/>
 <ellipse cx="65" cy="143" rx="9" ry="12" fill="#392b23"/><ellipse cx="135" cy="143" rx="9" ry="12" fill="#392b23"/>
 <circle cx="68" cy="139" r="3" fill="white"/><circle cx="138" cy="139" r="3" fill="white"/>
 <ellipse cx="100" cy="174" rx="13" ry="10" fill="#392b23"/>
 <path d="M84 194q16 18 32 0" fill="none" stroke="#76513b" stroke-width="6" stroke-linecap="round"/>
 <ellipse cx="45" cy="184" rx="15" ry="8" fill="#e99b83" opacity=".48"/><ellipse cx="155" cy="184" rx="15" ry="8" fill="#e99b83" opacity=".48"/>
 <g class="paw"><path class="outline" fill="url(#fox)" d="M25 272q-38-48-9-76 25-17 50 25l30 55-38 24z"/></g>
 <g class="paw r"><path class="outline" fill="url(#fox)" d="M175 272q38-48 9-76-25-17-50 25l-30 55 38 24z"/></g>
</g>
<g class="spark" fill="#f3bd35"><path d="M286 170l8 18 18 8-18 8-8 18-8-18-18-8 18-8z"/><path d="M592 130l6 14 14 6-14 6-6 14-6-14-14-6 14-6z"/></g>
</svg>