<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-label="Медведь, зайчик и лисёнок хлопают">
<defs>
 <linearGradient id="bg" x2="0" y2="1"><stop stop-color="#fffaf0"/><stop offset="1" stop-color="#f5e7d2"/></linearGradient>
 <style>
 .paw{transform-box:fill-box;transform-origin:center;animation:clap .42s ease-in-out infinite alternate}
 .paw.r{animation-delay:.21s}
 .body{stroke:#76543f;stroke-width:5;stroke-linejoin:round}
 @keyframes clap{from{transform:rotate(-24deg) translateX(-5px)}to{transform:rotate(24deg) translateX(5px)}}
 .conf{animation:fall 2.4s linear infinite}
 @keyframes fall{0%{transform:translateY(-18px) rotate(0);opacity:0}20%{opacity:1}100%{transform:translateY(45px) rotate(90deg);opacity:0}}
 @media(prefers-reduced-motion:reduce){.paw,.conf{animation:none}}
 </style>
</defs>
<rect width="900" height="520" rx="34" fill="url(#bg)"/>
<g class="conf" fill="#f4b942"><path d="M95 55h15v28H95z"/><path d="M450 20h14v25h-14z"/><path d="M780 58h14v26h-14z"/></g>
<g class="conf" fill="#70a9a0" style="animation-delay:.7s"><path d="M210 28l18 8-8 18-18-8z"/><path d="M620 35l18 8-8 18-18-8z"/></g>
<g class="conf" fill="#e58a59" style="animation-delay:1.2s"><path d="M350 50h13v25h-13z"/><path d="M850 15h13v25h-13z"/></g>
<!-- bear -->
<g transform="translate(70 100)">
 <ellipse cx="130" cy="315" rx="115" ry="24" fill="#d9c7ae"/>
 <circle class="body" cx="60" cy="90" r="43" fill="#a96f43"/><circle class="body" cx="200" cy="90" r="43" fill="#a96f43"/>
 <ellipse class="body" cx="130" cy="250" rx="105" ry="105" fill="#b77b4c"/>
 <circle class="body" cx="130" cy="125" r="112" fill="#c58a59"/>
 <ellipse cx="130" cy="158" rx="66" ry="51" fill="#f2d5b3"/>
 <circle cx="91" cy="118" r="9" fill="#342820"/><circle cx="169" cy="118" r="9" fill="#342820"/>
 <ellipse cx="130" cy="146" rx="12" ry="9" fill="#342820"/><path d="M112 169q18 18 36 0" fill="none" stroke="#68412e" stroke-width="6" stroke-linecap="round"/>
 <g class="paw"><path class="body" fill="#c58a59" d="M43 245q-45-45-15-72 25-17 55 42l26 45-30 22z"/></g>
 <g class="paw r"><path class="body" fill="#c58a59" d="M217 245q45-45 15-72-25-17-55 42l-26 45 30 22z"/></g>
</g>
<!-- bunny -->
<g transform="translate(350 70)">
 <ellipse cx="100" cy="345" rx="105" ry="22" fill="#d9c7ae"/>
 <ellipse class="body" cx="55" cy="40" rx="34" ry="100" fill="#eee0d1" transform="rotate(-12 55 40)"/>
 <ellipse class="body" cx="145" cy="40" rx="34" ry="100" fill="#eee0d1" transform="rotate(12 145 40)"/>
 <ellipse cx="55" cy="40" rx="13" ry="69" fill="#e7a6a0" transform="rotate(-12 55 40)"/>
 <ellipse cx="145" cy="40" rx="13" ry="69" fill="#e7a6a0" transform="rotate(12 145 40)"/>
 <ellipse class="body" cx="100" cy="250" rx="92" ry="100" fill="#f1e5d8"/>
 <circle class="body" cx="100" cy="145" r="100" fill="#f7eee5"/>
 <circle cx="65" cy="140" r="8" fill="#342820"/><circle cx="135" cy="140" r="8" fill="#342820"/>
 <ellipse cx="100" cy="164" rx="10" ry="8" fill="#d9878b"/><path d="M86 182q14 14 28 0" fill="none" stroke="#795b55" stroke-width="5" stroke-linecap="round"/>
 <g class="paw"><path class="body" fill="#f1e5d8" d="M25 260q-42-50-10-72 24-15 48 43l22 42-31 20z"/></g>
 <g class="paw r"><path class="body" fill="#f1e5d8" d="M175 260q42-50 10-72-24-15-48 43l-22 42 31 20z"/></g>
</g>
<!-- fox -->
<g transform="translate(625 105)">
 <ellipse cx="110" cy="310" rx="112" ry="23" fill="#d9c7ae"/>
 <path class="body" d="M35 235q-65 40-20 95 55 24 110-37" fill="#d9783e"/>
 <path d="M30 292q40 7 76-18" fill="none" stroke="#f6e4c9" stroke-width="25" stroke-linecap="round"/>
 <ellipse class="body" cx="110" cy="245" rx="100" ry="105" fill="#e98948"/>
 <path class="body" d="M20 100L30 5 90 55 130 55 190 5 200 100q-5 105-90 115Q25 205 20 100z" fill="#e98948"/>
 <path d="M43 83L39 30 80 70zM157 70l41-40-4 53z" fill="#f5d1bd"/>
 <path d="M27 133q82-75 166 0-22 85-83 85-61 0-83-85z" fill="#fff0df"/>
 <circle cx="75" cy="112" r="8" fill="#342820"/><circle cx="145" cy="112" r="8" fill="#342820"/>
 <ellipse cx="110" cy="145" rx="12" ry="9" fill="#342820"/><path d="M93 169q17 16 34 0" fill="none" stroke="#68412e" stroke-width="5" stroke-linecap="round"/>
 <g class="paw"><path class="body" fill="#e98948" d="M28 240q-40-45-10-70 25-16 50 40l25 43-31 25z"/></g>
 <g class="paw r"><path class="body" fill="#e98948" d="M192 240q40-45 10-70-25-16-50 40l-25 43 31 25z"/></g>
</g>
</svg>