<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-label="Пушистый медвежонок, зайчик и лисёнок радостно хлопают">
<defs>
 <linearGradient id="bg" x2="0" y2="1"><stop stop-color="#fffaf0"/><stop offset="1" stop-color="#f3e5cf"/></linearGradient>
 <radialGradient id="bear"><stop stop-color="#d6a16c"/><stop offset="1" stop-color="#a96d42"/></radialGradient>
 <radialGradient id="bunny"><stop stop-color="#fffaf2"/><stop offset="1" stop-color="#dfd0bd"/></radialGradient>
 <radialGradient id="fox"><stop stop-color="#ffb15e"/><stop offset="1" stop-color="#d86d32"/></radialGradient>
 <linearGradient id="belly" x2="0" y2="1"><stop stop-color="#f8e3c5"/><stop offset="1" stop-color="#e9c99e"/></linearGradient>
 <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%"><feGaussianBlur stdDeviation="9"/></filter>
 <style>
 .outline{stroke:#76513b;stroke-width:7;stroke-linecap:round;stroke-linejoin:round}
 .paw{transform-box:fill-box;transform-origin:50% 85%;animation:clap .48s ease-in-out infinite alternate}
 .paw.r{animation-delay:.24s}
 .ear{transform-box:fill-box;transform-origin:50% 90%;animation:ear 1.8s ease-in-out infinite}
 .spark{transform-box:fill-box;transform-origin:center;animation:twinkle 1.1s ease-in-out infinite alternate}
 .conf{animation:fall 2.8s linear infinite}
 @keyframes clap{from{transform:rotate(-17deg) translateX(-3px)}to{transform:rotate(17deg) translateX(3px)}}
 @keyframes ear{0%,100%{transform:rotate(0)}50%{transform:rotate(3deg)}}
 @keyframes twinkle{from{opacity:.35;transform:scale(.8)}to{opacity:1;transform:scale(1.15)}}
 @keyframes fall{0%{transform:translateY(-25px) rotate(0);opacity:0}20%{opacity:1}100%{transform:translateY(55px) rotate(90deg);opacity:0}}
 @media(prefers-reduced-motion:reduce){.paw,.ear,.spark,.conf{animation:none}}
 </style>
</defs>
<rect width="900" height="520" rx="36" fill="url(#bg)"/>
<ellipse cx="450" cy="445" rx="365" ry="34" fill="#bba98e" opacity=".22" filter="url(#shadow)"/>
<g class="conf" fill="#f2bd35"><path d="M90 42h13v32H90z"/><path d="M442 20h12v28h-12z"/><path d="M790 45h13v30h-13z"/></g>
<g class="conf" fill="#72b4ad" style="animation-delay:.8s"><path d="M205 30l18 8-8 18-18-8z"/><path d="M690 20l18 8-8 18-18-8z"/></g>
<g class="conf" fill="#e88b55" style="animation-delay:1.3s"><path d="M330 52h13v27h-13z"/><path d="M855 115l17 7-8 17-17-7z"/></g>
<!-- bear -->
<g transform="translate(75 105)">
 <ellipse cx="130" cy="337" rx="112" ry="20" fill="#b9a88e" opacity=".35"/>
 <circle class="outline" cx="56" cy="93" r="43" fill="url(#bear)"/><circle cx="56" cy="93" r="22" fill="#e5b98d"/>
 <circle class="outline" cx="204" cy="93" r="43" fill="url(#bear)"/><circle cx="204" cy="93" r="22" fill="#e5b98d"/>
 <ellipse class="outline" cx="130" cy="257" rx="104" ry="112" fill="url(#bear)"/>
 <ellipse cx="130" cy="278" rx="61" ry="68" fill="url(#belly)"/>
