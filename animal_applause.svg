 <path d="M84 214q16 19 32 0" fill="none" stroke="#765b55" stroke-width="6" stroke-linecap="round"/>
 <ellipse cx="48" cy="211" rx="15" ry="9" fill="#e9aaa2" opacity=".5"/><ellipse cx="152" cy="211" rx="15" ry="9" fill="#e9aaa2" opacity=".5"/>
 <g class="paw"><path class="outline" fill="#f5eade" d="M25 282q-37-49-9-77 25-18 49 26l31 55-38 24z"/></g>
 <g class="paw r"><path class="outline" fill="#f5eade" d="M175 282q37-49 9-77-25-18-49 26l-31 55 38 24z"/></g>
</g>
