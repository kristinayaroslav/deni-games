<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f8f1e5">
<title>Найди транспорт</title>
<style>
:root{color-scheme:light;--cream:#f8f1e5;--ink:#29343a;--muted:#81796e;--green:#4d9a68;--green-bg:#eaf5e9;--red:#c76c5b;--red-bg:#fff0eb;--card:#fffdf8}
*{box-sizing:border-box}body{margin:0;min-height:100svh;padding:max(12px,env(safe-area-inset-top)) 12px max(14px,env(safe-area-inset-bottom));display:flex;align-items:center;justify-content:center;background:var(--cream);color:var(--ink);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
main{width:min(100%,620px);text-align:center}.topline{margin:0 0 10px;color:var(--muted);font-size:14px;font-weight:650}
h1{margin:0 0 clamp(14px,3vh,25px);font-size:clamp(29px,7.5vw,42px);line-height:1.08;font-weight:800;letter-spacing:-.035em}
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(8px,2vw,14px)}
.card{appearance:none;display:block;width:100%;min-width:0;padding:clamp(4px,1vw,8px);border:4px solid transparent;border-radius:20px;background:var(--card);box-shadow:0 5px 18px rgb(70 55 35 / 8%);cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation;transition:border-color .16s,background-color .16s,transform .16s}
.card:active:not(:disabled){transform:scale(.975)}.card img{display:block;width:100%;aspect-ratio:1;object-fit:contain;border-radius:13px;background:#fffaf1}
.card:focus-visible,.action:focus-visible{outline:4px solid #6b9fc3;outline-offset:3px}
.card.correct{border-color:var(--green);background:var(--green-bg);animation:celebrate .9s ease both;box-shadow:0 0 0 5px #b9dfbd,0 0 25px #82c88a}
.card.wrong{border-color:var(--red);background:var(--red-bg);animation:nudge .22s ease-in-out}
.card:disabled{cursor:default}
.feedback{min-height:48px;margin:10px 0 0;display:flex;align-items:center;justify-content:center;font-size:19px;font-weight:750}
.action{display:none;min-height:54px;padding:12px 28px;border:0;border-radius:17px;background:var(--green);color:white;font:inherit;font-size:18px;font-weight:750;cursor:pointer;touch-action:manipulation}
.action.visible{display:inline-flex;align-items:center;justify-content:center}
.skip-stage{display:block;margin:-5px auto 14px;padding:10px 17px;border:1px solid #d8cdbb;border-radius:14px;background:#fffaf1;color:#665d52;font:inherit;font-size:14px;font-weight:650;cursor:pointer;touch-action:manipulation;box-shadow:0 2px 8px rgb(70 55 35 / 5%)}
.skip-stage:focus-visible{outline:3px solid #6b9fc3;outline-offset:2px;border-radius:8px}
.finish-mark{width:min(100%,440px);margin:0 auto 14px}.finish-mark img{display:block;width:100%;height:auto;border-radius:24px}
.finish h1{margin-bottom:12px}.finish p{margin:0 0 20px;color:var(--muted);font-size:18px}
.stage-card{padding:18px 0}
[hidden]{display:none!important}
@keyframes nudge{0%,100%{transform:translateX(0)}30%{transform:translateX(-4px)}70%{transform:translateX(4px)}}
@keyframes celebrate{0%{transform:scale(1)}35%{transform:scale(1.055)}65%{transform:scale(1.025)}100%{transform:scale(1)}}
@media(max-width:380px){body{padding-left:9px;padding-right:9px}.card{border-radius:16px}.card img{border-radius:10px}}
@media(max-height:650px){body{align-items:flex-start}main{margin:auto 0}h1{margin-bottom:12px;font-size:clamp(26px,6.5vw,34px)}.card img{max-height:34svh}.feedback{min-height:38px;margin-top:6px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<main>
<section id="game" aria-labelledby="prompt">
<div class="topline" id="progress">Этап 1 · Задание 1 из 10</div>
<h1 id="prompt">Найди корабль</h1>
<button class="skip-stage" id="skipStage" type="button">Перейти сразу к этапу 2 →</button>
<div class="cards" id="cards" aria-label="Выбери картинку"></div>
<div class="feedback" id="feedback" aria-live="polite"></div>
</section>
<section id="between" class="stage-card" hidden>
<h1>Первый этап пройден!</h1>
<p>А теперь попробуем найти транспорт среди четырёх картинок.</p>
<button class="action visible" id="startSecond" type="button">Начать второй этап</button>
</section>
<section class="finish" id="finish" hidden>
<div class="finish-mark"><img src="animal_applause.jpg" alt="Фотореалистичные медвежонок, зайчик и лисёнок аплодируют"></div>
<h1>Ура! Ты всё нашёл!</h1>
<p>Зверята аплодируют тебе!</p>
<button class="action visible" id="restart" type="button">Сыграть ещё</button>
</section>
</main>
<script>
const tasks=[
{target:"корабль",answer:"ship",pair:["ship","helicopter"]},
{target:"самосвал",answer:"dump_truck",pair:["hot_air_balloon","dump_truck"]},
{target:"поезд",answer:"train",pair:["train","tractor"]},
{target:"самолёт",answer:"airplane",pair:["excavator","airplane"]},
{target:"автобус",answer:"bus",pair:["bus","fire_engine"]},
{target:"полицейскую машину",answer:"police_car",pair:["ship","police_car"]},
{target:"фургон",answer:"van",pair:["helicopter","van"]},
{target:"трактор",answer:"tractor",pair:["hot_air_balloon","tractor"]},
{target:"пожарную машину",answer:"fire_engine",pair:["fire_engine","train"]},
{target:"экскаватор",answer:"excavator",pair:["bus","excavator"]}
];
const allVehicles=["ship","helicopter","dump_truck","train","tractor","excavator","airplane","bus","fire_engine","police_car","van","hot_air_balloon"];
const game=document.getElementById("game"),between=document.getElementById("between"),finish=document.getElementById("finish");
const progress=document.getElementById("progress"),prompt=document.getElementById("prompt"),cards=document.getElementById("cards"),feedback=document.getElementById("feedback"),skipStage=document.getElementById("skipStage");
let stage=1,index=0,locked=false,wrongTimer=null,nextTimer=null,audioCtx=null;
function playVehicleSound(vehicle){
 try{
  const Ctx=window.AudioContext||window.webkitAudioContext;if(!Ctx)return;
  if(!audioCtx)audioCtx=new Ctx();if(audioCtx.state==="suspended")audioCtx.resume();
  const now=audioCtx.currentTime;
  function tone(freq,start,duration,wave="sine",endFreq=null,gain=.12){
   const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=wave;
   o.frequency.setValueAtTime(freq,now+start);if(endFreq)o.frequency.exponentialRampToValueAtTime(endFreq,now+start+duration);
   g.gain.setValueAtTime(.001,now+start);g.gain.exponentialRampToValueAtTime(gain,now+start+.025);g.gain.exponentialRampToValueAtTime(.001,now+start+duration);
   o.connect(g);g.connect(audioCtx.destination);o.start(now+start);o.stop(now+start+duration+.03);
  }
  const beep=(freq,start,d=.16)=>tone(freq,start,d,"square",null,.07);
  switch(vehicle){
   case "airplane": tone(520,0,.75,"sawtooth",210,.045);break;
   case "bus": case "van": beep(740,0,.13);beep(740,.22,.13);break;
   case "train": tone(620,0,.22,"sawtooth",480,.09);tone(620,.32,.22,"sawtooth",480,.09);break;
   case "helicopter": for(let i=0;i<5;i++)tone(170,i*.12,.09,"square",125,.055);break;
   case "ship": tone(190,0,.85,"triangle",145,.16);break;
   case "fire_engine": case "police_car": tone(620,0,.24,"sawtooth",880,.08);tone(880,.26,.24,"sawtooth",620,.08);tone(620,.52,.24,"sawtooth",880,.08);break;
   case "dump_truck": case "tractor": tone(115,0,.5,"sawtooth",85,.12);beep(680,.58,.12);beep(680,.78,.12);break;
   case "excavator": tone(130,0,.32,"sawtooth",100,.1);tone(180,.38,.2,"square",140,.055);break;
   case "hot_air_balloon": tone(480,0,.5,"sine",700,.06);break;
  }
 }catch(e){}
}
function shuffle(list){const a=[...list];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function optionsFor(task){if(stage===1)return shuffle(task.pair);const extras=shuffle(allVehicles.filter(v=>v!==task.answer&&!task.pair.includes(v))).slice(0,2);return shuffle([task.answer,...task.pair.filter(v=>v!==task.answer),...extras])}
function renderTask(){
 const task=tasks[index];skipStage.hidden=stage!==1;locked=false;clearTimeout(wrongTimer);clearTimeout(nextTimer);
 progress.textContent=`Этап ${stage} · Задание ${index+1} из ${tasks.length}`;
 prompt.textContent=`Найди ${task.target}`;feedback.textContent="";
 cards.style.gridTemplateColumns="repeat(2,minmax(0,1fr))";cards.replaceChildren();
 cards.setAttribute("aria-label",stage===1?"Две картинки":"Четыре картинки");
 optionsFor(task).forEach((vehicle,i)=>{
  const b=document.createElement("button");b.type="button";b.className="card";b.setAttribute("aria-label",`Картинка ${i+1}`);
  const img=document.createElement("img");img.src=vehicle+".jpg";img.alt="";img.loading="eager";img.decoding="async";
  b.appendChild(img);b.addEventListener("click",()=>choose(b,vehicle,task.answer));cards.appendChild(b);
 });
}
function choose(button,selected,answer){
 if(locked)return;
 if(selected===answer){
  locked=true;clearTimeout(wrongTimer);button.classList.add("correct");playVehicleSound(selected);
  cards.querySelectorAll("button").forEach(b=>b.disabled=true);feedback.textContent="Правильно!";
  nextTimer=setTimeout(()=>{
   if(index<tasks.length-1){index++;renderTask()}
   else if(stage===1){game.hidden=true;between.hidden=false}
   else{game.hidden=true;finish.hidden=false}
  },1000);
 }else{
  button.classList.remove("wrong");void button.offsetWidth;button.classList.add("wrong");feedback.textContent="Попробуй ещё раз";
  clearTimeout(wrongTimer);wrongTimer=setTimeout(()=>button.classList.remove("wrong"),500);
 }
}
document.getElementById("startSecond").addEventListener("click",()=>{stage=2;index=0;between.hidden=true;game.hidden=false;renderTask()});
skipStage.addEventListener("click",()=>{stage=2;index=0;game.hidden=false;between.hidden=true;renderTask()});
document.getElementById("restart").addEventListener("click",()=>{stage=1;index=0;finish.hidden=true;game.hidden=false;renderTask()});
renderTask();
</script>
</body>
</html>
